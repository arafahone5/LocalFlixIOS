name: Build LocalFlix iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate App Icon (Red L on Black)
        run: |
          mkdir -p assets
          python3 - << 'EOF'
          import zlib, struct

          size = 1024
          bg = b"\x00\x00\x00"      # Pure black
          fg = b"\xe5\x09\x14"      # Netflix red

          x0, x1, x2 = 290, 445, 734
          y0, y1, y2 = 220, 654, 804

          empty_row = b"\x00" + bg * size
          stem_row  = b"\x00" + bg * x0 + fg * (x1 - x0) + bg * (size - x1)
          base_row  = b"\x00" + bg * x0 + fg * (x2 - x0) + bg * (size - x2)

          raw = (
              empty_row * y0
              + stem_row * (y1 - y0)
              + base_row * (y2 - y1)
              + empty_row * (size - y2)
          )

          def chunk(tag, data):
              return (
                  struct.pack("!I", len(data))
                  + tag
                  + data
                  + struct.pack("!I", zlib.crc32(tag + data) & 0xFFFFFFFF)
              )

          ihdr = struct.pack("!IIBBBBB", size, size, 8, 2, 0, 0, 0)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", ihdr)
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )
          with open("assets/icon.png", "wb") as f:
              f.write(png)
          print("Generated 1024x1024 assets/icon.png")
          EOF
      - name: Install Dependencies & Prebuild iOS
        run: |
          npm install
          npx expo install expo-asset babel-preset-expo react-native-webview @react-native-async-storage/async-storage expo-clipboard
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
      - name: Verify JS Bundle (Fast Check)
        run: |
          npx expo export --platform ios --output-dir /tmp/test-bundle
          rm -rf /tmp/test-bundle
      - name: Build Unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_BUNDLE=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          cp -r "$APP_BUNDLE" Payload/
          zip -r LocalFlix.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LocalFlix-iOS-IPA
          path: LocalFlix.ipa
